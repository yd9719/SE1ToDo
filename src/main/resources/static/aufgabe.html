<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unteraufgaben – ToDo-Verwaltung</title>
    <link rel="stylesheet" href="css/stil.css">
</head>
<body>
    <p><a href="index.html">&laquo; Zurück zur Aufgabenübersicht</a></p>

    <h1 id="aufgabenName">Aufgabe</h1>
    <p id="aufgabenDetails" class="hinweis"></p>

    <div id="meldung" class="meldung"></div>

    <h2 id="formularUeberschrift">Neue Unteraufgabe anlegen</h2>
    <form id="unteraufgabenFormular">
        <input type="hidden" id="bearbeiteId" value="">
        <label for="eingabePrioritaet">Priorität *</label>
        <select id="eingabePrioritaet">
            <option value="NIEDRIG">Niedrig</option>
            <option value="MITTEL" selected>Mittel</option>
            <option value="HOCH">Hoch</option>
        </select>
        <label for="eingabeStatus">Status *</label>
        <select id="eingabeStatus">
            <option value="OFFEN" selected>Offen</option>
            <option value="IN_ARBEIT">In Arbeit</option>
            <option value="ERLEDIGT">Erledigt</option>
        </select>
        <label for="eingabeFaelligkeit">Fällig am *</label>
        <input type="date" id="eingabeFaelligkeit" required>
        <br>
        <button type="submit" id="speichernKnopf">Anlegen</button>
        <button type="button" id="abbrechenKnopf" hidden>Abbrechen</button>
    </form>

    <h2>Unteraufgaben</h2>
    <table>
        <thead>
            <tr>
                <th>Priorität</th>
                <th>Status</th>
                <th>Fällig am</th>
                <th>Erledigt am</th>
                <th>Aktionen</th>
            </tr>
        </thead>
        <tbody id="unteraufgabenTabelle"></tbody>
    </table>
    <p id="leererHinweis" class="hinweis" hidden>Diese Aufgabe hat noch keine Unteraufgaben.</p>

    <script src="js/gemeinsam.js"></script>
    <script src="js/unteraufgaben.js"></script>
</body>
</html>
